name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build Rook Engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxext-dev libxfixes-dev \
            libxxf86vm-dev libxrender-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - name: Build and install Raylib 6.0
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git
          cmake -S raylib -B raylib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build raylib/build --parallel
          sudo cmake --install raylib/build
          sudo ldconfig

      - name: Build Rook Engine with Make
        run: make

      - name: Build Rook Engine with CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
